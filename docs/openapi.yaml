openapi: 3.1.0
info:
  title: Zoo Analytics Web API
  version: 1.0.0
  description: |
    API documentation for the Taman Safari Zoo Analytics dashboard and ingestion gateway.
    Handles AI telemetry events, CSV exports, AI engine live frame/stream proxies, and video replay.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/events:
    post:
      summary: Ingest AI Events Batch
      description: Ingests a batch of telemetry events from edge AI pipelines (zoo-monitor AnalyticsDispatcher).
      operationId: ingestEvents
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBatchRequest'
      responses:
        '200':
          description: Batch successfully ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer
                    example: 5
                  skipped:
                    type: integer
                    example: 0
        '401':
          description: Unauthorized (missing or invalid Bearer token)
        '413':
          description: Payload too large (batch exceeds 10,000 events)

    get:
      summary: Export Events to CSV
      description: Returns matching events formatted as a CSV file attachment.
      operationId: exportEventsCsv
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
            example: '2026-10-02'
          description: Filter events by calendar date in Western Indonesia Time (WIB). Defaults to today.
        - name: useCase
          in: query
          required: false
          schema:
            type: string
            enum: [vehicle_gate, cashier_presence, restaurant_counter, restaurant_table, horse_riding]
          description: Filter by pipeline use case.
        - name: eventType
          in: query
          required: false
          schema:
            type: string
          description: Filter by specific event type. Note that heartbeat events (status) are excluded unless explicitly specified.
        - name: cameraId
          in: query
          required: false
          schema:
            type: string
          description: Filter by source camera ID.
      responses:
        '200':
          description: CSV file attachment
          content:
            text/csv:
              schema:
                type: string

  /api/ai/health:
    get:
      summary: AI Engine Status & Camera List
      description: Proxies to the zoo-monitor AI engine to retrieve active pipelines and processing FPS.
      operationId: getAiHealth
      responses:
        '200':
          description: AI Engine health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  cameras:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiCamera'
        '502':
          description: AI Engine unreachable

  /api/ai/frame/{cameraId}:
    get:
      summary: Get Latest Annotated Frame Snapshot
      description: Proxies to the AI engine to retrieve a single JPEG frame with detection overlays.
      operationId: getAiFrame
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
        - name: t
          in: query
          required: false
          schema:
            type: string
          description: Cache buster parameter.
      responses:
        '200':
          description: JPEG image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '502':
          description: AI Engine unreachable

  /api/ai/stream/{cameraId}:
    get:
      summary: Live MJPEG Annotated Stream
      description: Proxies real-time multipart MJPEG video stream with zone and tracker annotations.
      operationId: getAiStream
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Multipart MJPEG stream
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '502':
          description: AI Engine unreachable

  /api/ai/snapshots/{path}:
    get:
      summary: Get Event Snapshot Image
      description: Retrieves the static full-resolution JPEG captured when an event was triggered.
      operationId: getAiSnapshot
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JPEG image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Snapshot not found

  /api/clip:
    get:
      summary: Get 30s Event Video Clip
      description: Retrieves an MP4 clip from MediaMTX playback server spanning from 15s before to 15s after the event.
      operationId: getEventClip
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: MediaMTX stream recording path.
        - name: ts
          in: query
          required: true
          schema:
            type: integer
          description: Event epoch timestamp in milliseconds.
      responses:
        '200':
          description: MP4 video clip
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Bad path or timestamp parameter
        '404':
          description: Recording not found or expired
        '502':
          description: MediaMTX server unreachable

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Configured via INGEST_API_KEY in .env.local

  schemas:
    IngestBatchRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventItem'

    EventItem:
      type: object
      required:
        - eventId
        - cameraId
        - useCase
        - eventType
        - data
      properties:
        eventId:
          type: string
          maxLength: 64
          example: 'evt_gate_001'
        cameraId:
          type: string
          example: 'cam-gate-01'
        cameraName:
          type: string
          example: 'Main Entrance Gate'
        useCase:
          type: string
          enum: [vehicle_gate, cashier_presence, restaurant_counter, restaurant_table, horse_riding]
        eventType:
          type: string
          example: 'vehicle_entry'
        severity:
          type: string
          enum: [info, warning, critical]
          default: info
        timestampMs:
          type: integer
          example: 1727870400000
        timestamp:
          type: string
          format: date-time
          example: '2026-10-02T10:00:00.000Z'
        nxCameraId:
          type: string
          nullable: true
          example: 'c8a40231-...'
        data:
          type: object
          description: Event-specific telemetry and evidence fields.
          additionalProperties: true

    AiCamera:
      type: object
      properties:
        id:
          type: string
          example: 'cam-gate-01'
        name:
          type: string
          example: 'Main Gate'
        useCase:
          type: string
          example: 'vehicle_gate'
        fps:
          type: number
          example: 15.0
        online:
          type: boolean
          example: true
